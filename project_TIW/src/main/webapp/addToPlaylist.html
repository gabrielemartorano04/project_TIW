<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiungi Brani alla Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <!-- Pulsante Torna alla Home -->
    <div style="margin-bottom: 20px;">
        <form th:action="@{/createPlaylist}" method="get">
            <button type="submit" style="padding: 6px 12px;">← Torna alla Home</button>
        </form>
    </div>

    <h1>Aggiungi brani alla playlist <span th:text="${playlist}"></span></h1>

    <form th:action="@{/addToPlaylist}" method="post">
        <input type="hidden" name="playlist" th:value="${playlist}"/>
        
        <div th:if="${#lists.isEmpty(songs)}">
            <p>Nessun brano disponibile da aggiungere.</p>
        </div>
        
        <div th:if="${!#lists.isEmpty(songs)}">
		    <ul style="list-style: none; padding: 0;">
		        <li th:each="s : ${songs}" style="margin-bottom: 10px;">
					<label style="display: inline-flex; align-items: left; gap: 10px; width: 100%; justify-content: flex-start;">		                
						<input type="checkbox" name="songs" th:value="${s.title}" />
						<span th:text="${s.title} + ' - ' + ${s.albumArtist} + ' (' + ${s.albumYear} + ')'" style="white-space: nowrap;"></span>		            
					</label>
		        </li>
		    </ul>
		    <button type="submit">Aggiungi alla Playlist</button>
		</div>
    </form>
</div>
</body>
</html>
