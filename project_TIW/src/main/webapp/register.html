<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
    <style>/* stesso stile tuo */</style>
</head>
<body>
<form th:action="@{/register}" method="post">
    <h2>Benvenuto! Crea un nuovo account</h2>
    <input type="text" name="name" placeholder="Nome" required>
    <input type="text" name="surname" placeholder="Cognome" required>
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <input type="password" name="confirm" placeholder="Conferma Password" required>
    <button type="submit">Registrati</button>
    <div class="error" th:if="${errorMsg != null}" th:text="${errorMsg}"></div>
    <div class="link"><a th:href="@{/login}">Hai già un account? Accedi</a></div>
</form>
</body>
</html>
