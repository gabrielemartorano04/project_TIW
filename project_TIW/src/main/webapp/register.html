<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - Playlist</title>
        <link rel="stylesheet" href="style.css"> 
</head>
<body>
<div class="container">
    <h1>Crea un nuovo account</h1>
    <form th:action="@{/register}" method="post">
        <input type="text" name="name" placeholder="Nome" required maxlength="100">
		<input type="text" name="surname" placeholder="Cognome" required maxlength="100">
		<input type="text" name="username" placeholder="Username" required maxlength="100">
		<input type="password" name="password" placeholder="Password" required maxlength="255">
		<input type="password" name="confirm" placeholder="Conferma Password" required maxlength="255">
        <button type="submit">Registrati</button>
        <div class="error" th:if="${errorMsg != null}" th:text="${errorMsg}"></div>
    </form>
    <div class="link">
        <a th:href="@{/login}">Hai già un account? Accedi</a>
    </div>
</div>
</body>
</html>
