<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sign in - Playlist</title>
        <link rel="stylesheet" href="style.css"> 
</head>
<body>
<div class="container">
    <h1>Create a new account</h1>
    <form th:action="@{/register}" method="post">
        <input type="text" name="name" placeholder="Name" required maxlength="100">
		<input type="text" name="surname" placeholder="Surname" required maxlength="100">
		<input type="text" name="username" placeholder="Username" required maxlength="50">
		<input type="password" name="password" placeholder="Password" required maxlength="255">
		<input type="password" name="confirm" placeholder="Confirm password" required maxlength="255">
        <button type="submit">Sign in</button>
        <div class="error" th:if="${errorMsg != null}" th:text="${errorMsg}"></div>
    </form>
    <div class="link">
        <a th:href="@{/login}">Do you already have an account? Login</a>
    </div>
</div>
</body>
</html>
