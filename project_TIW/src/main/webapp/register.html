<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - Playlist</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
        }

        .error {
            color: red;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }

        .link {
            margin-top: 20px;
            text-align: center;
        }

        .link a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Crea un nuovo account</h1>
    <form th:action="@{/register}" method="post">
        <input type="text" name="name" placeholder="Nome" required>
        <input type="text" name="surname" placeholder="Cognome" required>
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="password" name="confirm" placeholder="Conferma Password" required>
        <button type="submit">Registrati</button>
        <div class="error" th:if="${errorMsg != null}" th:text="${errorMsg}"></div>
    </form>
    <div class="link">
        <a th:href="@{/login}">Hai già un account? Accedi</a>
    </div>
</div>
</body>
</html>
