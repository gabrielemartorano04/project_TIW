<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Player - Dettagli brano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Dettagli brano</h1>

    <div class="song-details">
        <p><strong>Titolo:</strong> <span th:text="${song.title}"></span></p>
        <p><strong>Interprete:</strong> <span th:text="${song.albumArtist}"></span></p>
        <p><strong>Album:</strong> <span th:text="${song.albumName}"></span></p>
        <p><strong>Anno:</strong> <span th:text="${song.albumYear}"></span></p>
        <p><strong>Genere:</strong> <span th:text="${song.genre}"></span></p>

        <div>
            <strong>Copertina:</strong><br>
            <img th:src="@{${song.albumImg}}" alt="Copertina" style="max-width:300px; margin-top:10px;">
        </div>

        <div style="margin-top:20px;">
            <audio controls th:src="${song.mp3}">
                Il tuo browser non supporta l'audio HTML5.
            </audio>
        </div>
    </div>

    <div style="margin-top: 30px;">
        <a href="createPlaylist">← Torna alla Home</a>
    </div>
</div>
</body>
</html>
