<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Player - Dettagli brano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <!-- Pulsante Torna alla Home -->
    <div style="margin-bottom: 20px;">
        <form th:action="@{/createPlaylist}" method="get">
            <button type="submit" style="padding: 6px 12px;">← Return to home page</button>
        </form>
    </div>

    <h1>Song details</h1>

    <div class="song-details">
        <p><strong>Title:</strong> <span th:text="${song.title}"></span></p>
        <p><strong>Author/Group:</strong> <span th:text="${song.albumArtist}"></span></p>
        <p><strong>Album:</strong> <span th:text="${song.albumName}"></span></p>
        <p><strong>Year:</strong> <span th:text="${song.albumYear}"></span></p>
        <p><strong>Genre:</strong> <span th:text="${song.genre}"></span></p>

        <div>
            <strong>Album cover:</strong><br>
            <img th:src="@{${song.albumImg}}" alt="Copertina" style="max-width:300px; margin-top:10px;">
        </div>

        <div style="margin-top:20px;">
            <audio controls>
			    <source th:src="@{${song.mp3}}" type="audio/mpeg">
			</audio>
        </div>
    </div>
</div>
</body>
</html>
