<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Home - Playlist</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
<div class="container">
    <div th:if="${uploadSuccess}" class="success-message">✅ Brano aggiunto con successo!</div>
    <div th:if="${uploadError}" class="error-message" th:text="${uploadError}"></div>

    <h1 th:text="'Benvenuto, ' + ${username}">Benvenuto</h1>

    <div class="section">
        <h2>Le tue Playlist</h2>

        <!-- Nessuna playlist -->
        <p class="no-playlists" th:if="${playlists.isEmpty()}">Nessuna playlist creata</p>

        <!-- Elenco playlist -->
        <div th:each="p : ${playlists}" class="playlist" th:unless="${playlists.isEmpty()}">
            <a th:href="@{'/playlist'(name=${p})}" th:text="${p}"></a>
        </div>
    </div>

    <div class="section">
        <h2>Carica un nuovo brano</h2>
        <form th:action="@{/UploadTrackServlet}" method="post" enctype="multipart/form-data">
            <input type="text" name="titolo" placeholder="Titolo" required>
            <input type="text" name="album" placeholder="Album" required>
            <input type="text" name="interprete" placeholder="Interprete" required>
            <input type="number" name="anno" placeholder="Anno" required>
            <select name="genere" required>
                <option disabled selected value="">Scegli un genere</option>
                <option>Pop</option><option>Rock</option><option>Jazz</option><option>Rap</option>
                <option>Instrumental</option><option>Techno</option><option>Metal</option><option>Country</option>
                <option>Punk</option><option>Reggaeton</option><option>Indie</option><option>Hip Hop</option>
                <option>Blues</option><option>Other</option>
            </select>
            <label>Copertina:</label><input type="file" name="cover" required>
            <label>File MP3:</label><input type="file" name="audio" required>
            <button type="submit">Carica brano</button>
        </form>
    </div>

    <div class="section">
        <h2>Crea una nuova Playlist</h2>
        <form th:action="@{/addToPlaylist}" method="post">
            <input type="text" name="titolo" placeholder="Titolo playlist" required>
            <button type="submit">Crea Playlist</button>
        </form>
    </div>
</div>
</body>
</html>
