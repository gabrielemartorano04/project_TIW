<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Home - Playlist</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
<div class="container">
    <div th:if="${uploadSuccess}" class="success-message">Song added successfully!</div>
    <div th:if="${uploadError}" class="error-message" th:text="${uploadError}"></div>

    <h1 th:text="'Welcome, ' + ${username}">Welcome</h1>

    <div class="section">
        <h2>Your playlists</h2>

        <!-- Nessuna playlist -->
        <p class="no-playlists" th:if="${playlists.isEmpty()}">No playlist created</p>

        <!-- Elenco playlist -->
        <div th:each="p : ${playlists}" class="playlist" th:unless="${playlists.isEmpty()}">
            <a th:href="@{'/playlist'(name=${p.title})}" th:text="${p.title}"></a>
        </div>
    </div>

    <div class="section">
        <h2>Upload a new song</h2>
        <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
		    <input type="text" name="titolo" placeholder="Title" required maxlength="100">
		    <input type="text" name="album" placeholder="Album" required maxlength="100">
		    <input type="text" name="interprete" placeholder="Author/Group" required maxlength="100">
		    <input type="number" name="anno" placeholder="Year" required min="1900" max="2025">
		    <select name="genere" required>
		        <option disabled selected value="">Select genre</option>
		        <option>Pop</option><option>Rock</option><option>Jazz</option><option>Rap</option>
		        <option>Instrumental</option><option>Techno</option><option>Metal</option><option>Country</option>
		        <option>Punk</option><option>Reggaeton</option><option>Indie</option><option>Hip Hop</option>
		        <option>Blues</option><option>Classical</option><option>Other</option>
		    </select>
		    <label>Album cover:</label>
		    <input type="file" name="cover" accept="image/jpeg,image/png" required>
		    <label>Audio file:</label>
		    <input type="file" name="audio" accept="audio/mpeg" required>
		    <button type="submit">Upload song</button>
		</form>
    </div>

    <div class="section">
        <h2>Create a new playlist</h2>
        <form th:action="@{/createPlaylist}" method="post">
			<input type="text" name="titolo" placeholder="Playlist title" required maxlength="100">
            <button type="submit">Create playlist</button>
        </form>
    </div>
</div>
</body>
</html>
