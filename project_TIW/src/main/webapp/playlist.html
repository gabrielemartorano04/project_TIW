<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title th:text="'Playlist - ' + ${playlistName}">Playlist</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
<div class="container">

    <!-- Pulsante Torna alla Home -->
    <div style="margin-bottom: 20px;">
        <form th:action="@{/createPlaylist}" method="get">
            <button type="submit" style="padding: 6px 12px;">← Torna alla Home</button>
        </form>
    </div>

    <h1 th:text="'Playlist: ' + ${playlistName}">Playlist</h1>

    <!-- Controlli paginazione -->
	<div class="pagination-controls" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
	    <div>
	        <form th:if="${hasPrev}" th:action="@{/playlist}" method="get">
	            <input type="hidden" name="name" th:value="${playlistName}">
	            <input type="hidden" name="page" th:value="${page - 1}">
	            <button type="submit">← Precedenti</button>
	        </form>
	    </div>
	    <div>
	        <form th:if="${hasNext}" th:action="@{/playlist}" method="get">
	            <input type="hidden" name="name" th:value="${playlistName}">
	            <input type="hidden" name="page" th:value="${page + 1}">
	            <button type="submit">Successivi →</button>
	        </form>
	    </div>
	</div>

    <!-- Elenco canzoni -->
    <div th:if="${#lists.isEmpty(tracks)}" style="text-align:center; font-style: italic; color: #888; margin-bottom: 20px;">
	    Nessuna canzone presente nella playlist
	</div>
	
	<table th:if="${!#lists.isEmpty(tracks)}">
	    <tr>
	        <td th:each="track : ${tracks}">
	            <a th:href="@{'/player'(title=${track.title})}">
	                <img th:src="${track.albumImg}" alt="cover" style="width: 150px; height: 150px;">
	                <div th:text="${track.title}"></div>
	            </a>
	        </td>
	    </tr>
	</table>

    <!-- Sezione per aggiungere nuovi brani -->
	<div class="section">
	    <h2>Aggiungi nuovi brani alla playlist</h2>
	    
	    <form th:action="@{/addToPlaylist}" method="get">
	        <input type="hidden" name="playlist" th:value="${playlistName}">
	        <button type="submit">Vai a selezione brani</button>
	    </form>
	</div>
	</div>
</body>
</html>
