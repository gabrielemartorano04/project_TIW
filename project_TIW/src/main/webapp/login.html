<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>/* stile tuo a piacere */</style>
</head>
<body>
<form th:action="@{/login}" method="post">
    <h2>Accedi</h2>
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
    <div class="error" th:if="${errorMsg != null}" th:text="${errorMsg}"></div>
    <div class="link"><a th:href="@{/register}">Non hai un account? Registrati</a></div>
</form>
</body>
</html>
