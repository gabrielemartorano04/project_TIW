<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - Playlist</title>
    <link rel="stylesheet" href="style.css"> 
 
</head>
<body>
<div class="container">
    <h1>Login to your account</h1>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Username" required maxlength="50">
		<input type="password" name="password" placeholder="Password" required maxlength="255">
        <button type="submit">Login</button>
        <div class="error" th:if="${errorMsg != null}" th:text="${errorMsg}"></div>
    </form>
    <div class="link">
        <a th:href="@{/register}">Don't have an account yet? Sign in</a>
    </div>
</div>
</body>
</html>
